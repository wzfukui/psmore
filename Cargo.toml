[package]
name = "psmore"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["wzfukui <fukui@wuzhi-ai.com>"]
description = "A relationship-first process diagnostics workbench for macOS and Linux"
readme = "README.md"
keywords = ["process", "diagnostics", "tui", "macos", "linux"]
categories = ["command-line-utilities", "development-tools::debugging"]
publish = false

[dependencies]
crossterm = "0.29"
# ratatui accepts any instability 0.3.x release, but 0.3.11+ requires
# Rust 1.88. Keep psmore's documented Rust 1.85 minimum reproducible.
instability = "=0.3.10"
libc = "0.2"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.36"
unicode-width = "0.2"
