[package]
name = "psmore"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
# ratatui accepts any instability 0.3.x release, but 0.3.11+ requires
# Rust 1.88. Keep psmore's documented Rust 1.85 minimum reproducible.
instability = "=0.3.10"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.36"
unicode-width = "0.2"
