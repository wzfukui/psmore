name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.85.0
  RUSTUP_TOOLCHAIN: 1.85.0

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate tag and package version
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install minimum Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Install musl target support
        if: contains(matrix.target, 'musl')
        run: |
          rustup target add "${{ matrix.target }}"
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build package
        run: scripts/package-release.sh --target "${{ matrix.target }}"
      - name: Verify package install and uninstall
        run: scripts/verify-release-package.sh dist/psmore-v*-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: psmore-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: psmore-*
          path: dist
          merge-multiple: true
      - name: Build aggregate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "psmore ${{ github.ref_name }}"
          body: |
            ## psmore release ${{ github.ref_name }}
            This release is built automatically by the Release workflow.
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish-crates:
    name: Publish to crates.io
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install minimum Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        run: cargo +"$RUST_VERSION" publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
